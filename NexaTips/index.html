<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>NexaTips</title>
<link rel="icon" type="image/png" href="./icon.png?v=1.6.3">
<link rel="apple-touch-icon" sizes="180x180" href="./icon.png?v=1.6.3">
<style>:root{color-scheme:light;--bg:#f7f8fd;--tx:#28377e;--mu:#566598;--ln:#303f91;--surface:#fff;--soft:#f0f2fc;--border:#d4daf1;--field:#b6bfdf;--on:#fff;--red:#b42318;--green:#17734a}
:root[data-theme=dark]{color-scheme:dark;--bg:#10152c;--tx:#e5e9ff;--mu:#adb8e5;--ln:#a1afff;--surface:#1b2447;--soft:#232f59;--border:#425080;--field:#6371a0;--on:#10152c;--red:#ff9992;--green:#84dbab}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:auto;padding:20px 16px 36px}
header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:18px}
h1{font-size:28px;letter-spacing:-.035em;margin:0}
h2{font-size:21px;margin:0 0 14px}
h3{font-size:17px;margin:0 0 8px}
p{margin:8px 0}
nav,.actions{display:flex;gap:8px;flex-wrap:wrap}
nav{margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:0 3px 14px rgba(40,55,126,.055);padding:20px;margin-bottom:16px}
label{display:grid;gap:4px;font-size:14px;color:var(--mu)}
input,select,textarea{width:100%;min-height:46px;padding:8px 12px;border:1px solid var(--field);border-radius:10px;background:var(--surface);color:var(--tx);font:inherit;font-size:16px}
textarea{display:block;resize:vertical;margin:10px 0}
button,.button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:9px 15px;border:1px solid var(--ln);border-radius:10px;background:var(--surface);color:var(--tx);font:600 15px/1.3 inherit;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none}
button:hover,.button:hover{background:var(--soft)}
.primary,[aria-current=page]{background:var(--ln);color:var(--on)}
.primary:hover,[aria-current=page]:hover{background:var(--ln);filter:brightness(1.13)}
:focus-visible{outline:3px solid #788cf0;outline-offset:2px}
button:disabled{opacity:.55;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.item{border-top:1px solid var(--border);padding:12px 0}
.item:last-child{padding-bottom:0}
.meta{color:var(--mu);font-size:14px}
.error,.remove{color:var(--red)}
#status:empty{display:none}
#status{margin-bottom:12px}
@media(max-width:430px){main{padding:14px 12px 28px}.card{padding:15px}h1{font-size:24px}nav button{padding:8px 11px}}
[hidden]{display:none !important}
.topbar{position:relative;gap:12px;padding-bottom:10px;border:0}
.brand{min-width:0}
.brand h1{font-size:clamp(20px,4.5vw,30px);line-height:1.1;overflow-wrap:anywhere}
.version{margin-top:5px}
.top-actions{display:flex;flex-shrink:0;gap:8px;align-items:center}
.top-actions button{gap:7px;min-height:42px;padding:8px 12px;white-space:nowrap}
.top-actions button span:first-child{font-size:18px;line-height:1}
.menu-anchor{position:relative}
#menu-panel{position:absolute;top:calc(100% + 8px);right:0;z-index:5;width:192px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 12px 30px rgba(40,55,126,.15);padding:10px}
#tabs{display:grid;gap:6px;margin:0 0 6px}
#menu-panel button{width:100%;justify-content:flex-start}
@media(max-width:430px){
  .topbar,.top-actions{gap:6px}
  .top-actions button{font-size:14px;padding:7px 9px}
  .version{font-size:13px}
}
main{width:100%;padding-inline:max(12px,env(safe-area-inset-left)) max(12px,env(safe-area-inset-right))}
.card,.grid,.grid>* ,label,.row>*{min-width:0}
input,select,textarea,button,.button{max-width:100%;min-width:0}
.card{overflow-wrap:anywhere}
.grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
#login-panel{max-width:500px;margin-inline:auto}
#login-form .grid{grid-template-columns:minmax(0,1fr)}
.login-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
#password-reset{display:inline-block;margin:12px 0;color:var(--tx);text-underline-offset:.18em}
#login-status:empty{display:none}
@media(max-width:480px){
  html{-webkit-text-size-adjust:100%}
  .topbar{align-items:flex-start;gap:8px;margin-bottom:8px;padding-bottom:4px}
  .top-actions{gap:4px}
  .top-actions #menu-toggle,.top-actions #logout{width:44px;min-height:44px;padding:0;border-color:transparent;background:transparent}
  .top-actions .top-action-label{display:none}
  .menu-anchor{position:static}
  #menu-panel{top:100%;right:0;max-width:100%}
  button,.button{touch-action:manipulation}
}


.tip-day{border-top:1px solid var(--border);padding:10px 0}
.tip-day>summary{cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.tip-day>summary strong:first-letter{text-transform:uppercase}
.tip-day>summary::before{content:"+";font-weight:700}
.tip-day[open]>summary::before{content:"−"}
.tip-day>summary>strong{flex:1}
.opening{display:flex;align-items:center;gap:8px;margin:8px 0 12px}
.opening input{width:20px;min-height:20px;margin:0}
.assignment{display:grid;grid-template-columns:minmax(0,1fr) minmax(96px, 125px) auto;align-items:center;gap:8px;margin:6px 0}
.points-control{display:grid;grid-template-columns:minmax(0,1fr) 40px;align-items:stretch}
.points-control input{padding-inline:8px;border-radius:10px 0 0 10px}
.point-arrows{display:grid;grid-template-rows:repeat(2,minmax(25px,1fr))}
.point-arrows button{min-height:0;padding:0;border-color:var(--field);border-left:0;border-radius:0 10px 0 0;line-height:1;touch-action:manipulation}
.point-arrows button+button{border-top:0;border-radius:0 0 10px 0}
.worker-state{display:block;color:var(--mu);font-size:14px}
.worker-state.is-active{color:var(--green)}
.add-worker{margin-top:12px}
.result-meta{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.result-meta div{background:var(--soft);padding:10px 12px;border-radius:10px;display:grid}
.result-meta span{color:var(--mu);font-size:14px}
.result-meta strong{font-size:22px;font-variant-numeric:tabular-nums}
.payout-list{padding:0;list-style:none}
.payout-list li{display:grid;grid-template-columns:minmax(0,1fr) 3rem 6.5rem;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
.payout-list li strong{text-align:right}
.worker-form{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:10px;margin-bottom:12px}
.history-day{font-size:14px;padding:8px 0;border-top:1px solid var(--border)}
.history-day p{margin:3px 0}

[data-history-year][aria-pressed=true]{background:var(--ln);color:var(--on)}
.annual-totals{list-style:none;padding:0;margin:0 0 20px}
.annual-totals li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--border)}

.worker-profiles .worker-profile-item{border-top:1px solid var(--border);padding:10px 0}
.worker-profile-item>summary,.worker-profile-inactive>summary{cursor:pointer;min-height:34px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.worker-profile-item>summary::before,.worker-profile-inactive>summary::before{content:"+"}
.worker-profile-item[open]>summary::before,.worker-profile-inactive[open]>summary::before{content:"−"}
.worker-profile-item>summary strong,.worker-profile-inactive>summary strong{flex:1}
.worker-profile-item>summary span,.worker-profile-inactive>summary span{color:var(--muted,var(--mu));font-size:14px}
.worker-profile{padding:12px 0 4px}
.worker-profile-fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));margin-bottom:12px}
.worker-profile-option{display:flex;align-items:center;gap:8px;margin:10px 0}
.worker-profile-option input{width:20px;height:20px;min-height:20px;margin:0;flex:none}
.worker-profiles h3{margin-top:14px}

.worker-contact-actions{margin-bottom:8px}
.worker-contact-actions label{position:relative;cursor:pointer}
.worker-contact-actions input{position:absolute;inset:0;opacity:0;cursor:pointer}
.worker-contact-actions label:focus-within{outline:3px solid #788cf0;outline-offset:2px}
[data-worker-contact-options] label{margin-bottom:8px}

.worker-contact-actions:empty{display:none}
</style>
<link rel="manifest" href="./manifest.webmanifest">
</head>
<body>
<main>
<header class="topbar">
  <div class="brand"><h1>NexaTips</h1><div class="meta version">Versió 1.6.3<span id="sync-state" role="status"></span></div></div>
  <div class="top-actions">
    <div class="menu-anchor">
      <button id="menu-toggle" type="button" aria-label="Menú" aria-expanded="false" aria-controls="menu-panel" hidden><span aria-hidden="true">☰</span><span class="top-action-label" aria-hidden="true">Menú</span></button>
      <div id="menu-panel" hidden>
        <nav aria-label="Seccions" id="tabs"></nav>
        <button id="theme" type="button" aria-pressed="false">Mode fosc</button>
      </div>
    </div>
    <button id="logout" type="button" aria-label="Sortir" hidden><span aria-hidden="true">↪︎</span><span class="top-action-label" aria-hidden="true">Sortir</span></button>
  </div>
</header>
<section id="login-panel" class="card">
<h2>Inicia sessió</h2>
<p id="login-status" role="status">Carregant l’accés…</p>
<form id="login-form">
<div class="grid">
<label>Correu<input name="email" type="email" autocomplete="username" autocapitalize="none" required></label>
<label>Contrasenya<input name="password" type="password" autocomplete="current-password" required></label>
</div>
<div class="login-actions">
<button class="primary" value="login">Entra</button>
<button class="primary" value="register">Crea un compte</button>
</div>
<a id="password-reset" href="#reset-panel">He oblidat la contrasenya</a></form>
<details id="reset-panel" class="item" hidden>
<summary>Restableix amb un enllaç del correu</summary>
<form id="reset-link-form">
<div class="grid">
<label>Enllaç del correu de restabliment<input name="link" type="url" autocomplete="off" autocapitalize="none" required></label>
<label>Contrasenya nova<input name="password" type="password" minlength="6" autocomplete="new-password" required></label>
</div>
<button class="primary">Desa la contrasenya nova</button>
</form></details>
<div class="actions" id="verify-actions" hidden>
<button id="retry-login">Comprova l’accés</button>
<button id="resend-verification">Torna a enviar el correu</button>
</div>
<form id="verify-link-form" class="item" hidden>
<label>L’enllaç del correu dona error? Enganxa’l aquí<input name="link" type="url" autocomplete="off" autocapitalize="none" required></label>
<button type="submit">Verifica el correu</button>
</form></section>
<div id="workspace" hidden>
<p id="status" role="status"></p>
<section id="content" aria-label="Contingut"></section>
</div>
</main>
<script type="module">
// Stored values are measured in quarter points, including older repartiments.
const pointScale = 250000;
const maxUnits = 3999999.999996;
const validUnits = units => typeof units === 'number' && units >= 0 && units <= maxUnits &&
  Math.round(units * pointScale) / pointScale === units;
const dayMs = 86400000;
const dayOf = date => new Date(date + 'T00:00:00Z');
const isoDay = date => date.toISOString().slice(0, 10);
const shiftDay = (date, count) => isoDay(new Date(+dayOf(date) + count * dayMs));
const validDay = date => typeof date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(date)
  && Number.isFinite(+dayOf(date)) && isoDay(dayOf(date)) === date;
const weekday = date => dayOf(date).getUTCDay();

function distribute(cents, days) {
  const totals = new Map();
  for (const day of days) {
    if (!day.open) continue;
    for (const {id, units} of day.entries) {
      const scaled = BigInt(Math.round((units ?? 0) * pointScale));
      totals.set(id, (totals.get(id) ?? 0n) + scaled);
    }
  }
  const units = [...totals.values()].reduce((sum, value) => sum + value, 0n);
  const payouts = [...totals].map(([id, points]) => {
    const product = BigInt(cents) * points;
    return {id, units: Number(points) / pointScale, cents: units ? Number(product / units) : 0,
      remainder: units ? product % units : 0n};
  });
  payouts.sort((a, b) => a.remainder === b.remainder ? (a.id < b.id ? -1 : 1) : (a.remainder > b.remainder ? -1 : 1));
  if (units) {
    const remaining = cents - payouts.reduce((sum, row) => sum + row.cents, 0);
    for (let index = 0; index < remaining; index++) payouts[index].cents++;
  }
  return {units: Number(units) / pointScale, payouts: payouts.map(({remainder, ...row}) => row)};
}

function periodDays(date, previous, workers) {
  const start = previous ? shiftDay(previous.date, 1) : shiftDay(date, -6);
  const template = new Map(previous?.days.map(day => [weekday(day.date), day]));
  const active = new Set(workers.filter(worker => worker.active).map(worker => worker.id));
  const days = [];
  for (let current = start; current <= date; current = shiftDay(current, 1)) {
    const source = template.get(weekday(current));
    days.push({date: current, open: source?.open ?? false,
      entries: (source?.entries ?? []).filter(row => active.has(row.id)).map(({id, units}) => ({id, units}))});
  }
  return days;
}

function suggestedPoints(id, date, days, periods) {
  const earlier = [...days, ...periods.flatMap(period => period.days)]
    .filter(day => day.open && day.date < date);
  let match;
  let previous;
  for (const day of earlier) {
    const units = day.entries.find(row => row.id === id)?.units;
    if (!validUnits(units)) continue;
    if (day.date === shiftDay(date, -1)) previous = units;
    if (units > 0 && weekday(day.date) === weekday(date) && (!match || day.date > match.date)) {
      match = {date:day.date, units};
    }
  }
  return {matching:match?.units, previous};
}

function parseCents(text) {
  const match = /^(\d{1,7})(?:[.,](\d{1,2}))?$/.exec(text.trim());
  return match ? Number(match[1]) * 100 + Number((match[2] ?? '').padEnd(2, '0')) : null;
}

function whatsappPhone(value) {
  const text = String(value || '').trim();
  if (!/^\+?[\d\s().-]+$/.test(text)) return '';
  const digits = text.replace(/\D/g,'');
  if (digits.startsWith('00')) return whatsappPhone('+'+digits.slice(2));
  if (!text.startsWith('+') && /^[6789]\d{8}$/.test(digits)) return '34'+digits;
  return /^[1-9]\d{7,14}$/.test(digits) ? digits : '';
}

function vCardContact(text) {
  const entries = text.replace(/\r?\n[ \t]/g,'').split(/\r?\n/);
  if (entries.filter(line => /^BEGIN:VCARD$/i.test(line.trim())).length !== 1) return null;
  const values = field => entries.filter(line =>
    new RegExp('^(?:[\\w-]+\\.)?'+field+'(?:;[^:]*)?:','i').test(line)
  ).map(line => line.slice(line.indexOf(':')+1)
    .replace(/\\[nN]/g,' ').replace(/\\([,;\\])/g,'$1').trim()).filter(Boolean);
  return {
    name:values('FN')[0] ?? '',
    tel:values('TEL').map(value => value.replace(/^tel:/i,'')),
    email:values('EMAIL').map(value => value.replace(/^mailto:/i,'')),
    uid:values('UID')[0] ?? ''
  };
}

function isMobileContactDevice() {
  return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
    (/Macintosh/i.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
}

function renderWorkerProfiles(workers, escapeHtml) {
  const sorted = workers.slice().sort((a,b) => a.name.localeCompare(b.name,'ca'));
  const form = worker =>
    '<form class="worker-profile" data-worker-profile="'+escapeHtml(worker?.id ?? '')+'">'+
    '<div class="actions worker-contact-actions">'+
    (typeof navigator.contacts?.select === 'function' ? '<button type="button" data-worker-contact>Tria de l’agenda</button>' : '')+
    (isMobileContactDevice() ? '' : '<label class="button">Importa contacte Apple (.vcf)<input type="file" accept=".vcf,text/vcard,text/x-vcard" data-worker-vcard></label>')+'</div>'+
    '<input type="hidden" name="contactName" value="'+escapeHtml(worker?.contactName ?? '')+'">'+
    '<input type="hidden" name="contactUid" value="'+escapeHtml(worker?.contactUid ?? '')+'">'+
    '<div data-worker-contact-options></div><p class="meta" data-worker-contact-status role="status" '+(worker?.contactName ? '' : 'hidden')+'>'+
    (worker?.contactName ? 'Contacte associat: '+escapeHtml(worker.contactName) : '')+'</p>'+
    '<div class="worker-profile-fields">'+
    '<label>Nom<input name="name" maxlength="80" value="'+escapeHtml(worker?.name ?? '')+'" required></label>'+
    '<label>Correu<input name="email" type="email" maxlength="254" value="'+escapeHtml(worker?.email ?? '')+'"></label>'+
    '<label>Telèfon<input name="phone" type="tel" maxlength="48" value="'+escapeHtml(worker?.phone ?? '')+'"></label></div>'+
    '<label class="worker-profile-option"><input type="checkbox" name="active" '+(!worker || worker.active ? 'checked' : '')+'> '+(worker && !worker.active ? 'Reactiva per al repartiment de propines' : 'Actiu per al repartiment de propines')+'</label>'+
    '<label class="worker-profile-option"><input type="checkbox" name="tipsView" '+(worker?.tipsView ? 'checked' : '')+'> Pot consultar el repartiment actual de NexaTips</label>'+
    '<button class="primary">'+(worker ? 'Desa la fitxa' : 'Afegeix el treballador')+'</button></form>';
  const active = sorted.filter(worker => worker.active);
  const inactive = sorted.filter(worker => !worker.active);
  const renderRow = worker => '<details class="worker-profile-item"><summary><strong>'+escapeHtml(worker.name)+
    '</strong></summary>'+form(worker)+'</details>';
  return '<section class="card worker-profiles"><h2>Equip</h2>'+
    '<details class="worker-profile-item"><summary>Afegeix un treballador</summary>'+form(null)+'</details>'+
    '<h3>Membres actius</h3>'+
    (active.length ? active.map(renderRow).join('') : '<p class="meta">Encara no hi ha membres actius.</p>')+'</section>'+
    (inactive.length ? '<section class="card worker-profiles"><details class="worker-profile-inactive">'+
      '<summary><strong>Membres inactius</strong><span>'+inactive.length+'</span></summary>'+
      inactive.map(renderRow).join('')+'</details></section>' : '');
}

function workerProfilePayload(form) {
  const fields = form.elements;
  return {action:'workerProfile',id:form.dataset.workerProfile,name:fields.name.value,email:fields.email.value,
    phone:fields.phone.value,active:fields.active.checked,tipsView:fields.tipsView.checked,
    contactName:fields.contactName.value,contactUid:fields.contactUid.value};
}


function bindWorkerContacts(container) {
  const contactsByForm = new WeakMap();

  function updateContactStatus(form, text) {
    const status = form.querySelector('[data-worker-contact-status]');
    status.textContent = text;
    status.hidden = !text;
  }

  function setWorkerContactField(form, field, value) {
    const fields = form.elements;
    if (field === 'email' && value.toLowerCase() !== fields.email.value.trim().toLowerCase() && fields.tipsView.checked) {
      fields.tipsView.checked = false;
      return true;
    }
    return false;
  }

  function fillWorkerContact(form, contact) {
    const fields = form.elements;
    if (contact.name && !form.dataset.workerProfile) fields.name.value = contact.name.trim().slice(0,80);
    const groups = [
      ['email','Correu',contact.email || [],254],
      ['phone','Telèfon',contact.tel || [],48]
    ];
    const choices = document.createDocumentFragment();
    let reviewAccess = false;
    for (const [field,label,values,limit] of groups) {
      const options = [...new Set(values.map(value => value.trim().slice(0,limit)).filter(Boolean))];
      if (options.length === 1) {
        if (setWorkerContactField(form,field,options[0])) reviewAccess = true;
        fields[field].value = options[0];
      }
      if (options.length < 2) continue;
      const select = document.createElement('select');
      select.dataset.workerContactField = field;
      select.add(new Option('Tria '+label.toLowerCase(),''));
      for (const value of options) select.add(new Option(value,value));
      const wrapper = document.createElement('label');
      wrapper.append(label+' del contacte',select);
      choices.append(wrapper);
    }
    const panel = form.querySelector('[data-worker-contact-options]');
    panel.querySelectorAll('label:has([data-worker-contact-field])').forEach(label => label.remove());
    panel.append(choices);
    fields.contactName.value = (contact.name || contact.email?.[0] || contact.tel?.[0] || '').slice(0,160);
    fields.contactUid.value = contact.uid ?? '';
    updateContactStatus(form,'Revisa les dades del contacte i desa la fitxa.'+
      (reviewAccess ? ' Revisa si vols autoritzar el correu nou a NexaTips.' : ''));
  }

  container.addEventListener('click',async event => {
    const picker = event.target.closest('[data-worker-contact]');
    if (!picker) return;
    const {form} = picker;
    try {
      const [contact] = await navigator.contacts.select(['name','email','tel'],{multiple:false});
      if (!contact || !form.isConnected) return;
      form.querySelector('[data-worker-contact-options]').replaceChildren();
      fillWorkerContact(form,{...contact,name:contact.name?.[0]});
    } catch (error) {
      if (form.isConnected && error.name !== 'AbortError') updateContactStatus(form,'No s’ha pogut obrir l’agenda. Pots escriure les dades al formulari.');
    }
  });

  container.addEventListener('change',async event => {
    const input = event.target;
    if (input.matches('[data-worker-contact-field]') && input.value) {
      const field = input.dataset.workerContactField;
      if (setWorkerContactField(input.form,field,input.value))
        updateContactStatus(input.form,'Revisa si vols autoritzar el correu nou a NexaTips abans de desar.');
      input.form.elements[field].value = input.value;
    } else if (input.matches('[data-worker-contact-choice]') && input.value) {
      const contact = contactsByForm.get(input.form)?.[Number(input.value)];
      if (contact) fillWorkerContact(input.form,contact);
    } else if (input.matches('[data-worker-vcard]') && input.files[0]) {
      const {form} = input;
      try {
        const file = input.files[0];
        if (file.size > 8*1024*1024) throw new Error();
        const text = await file.text();
        if (!form.isConnected) return;
        const contacts = (text.match(/^[ \t]*BEGIN:VCARD[ \t]*\r?$[\s\S]*?^[ \t]*END:VCARD[ \t]*\r?$/gim) || [])
          .map(vCardContact).filter(contact => contact && (contact.name || contact.email.length || contact.tel.length));
        if (!contacts.length) throw new Error();
        const panel = form.querySelector('[data-worker-contact-options]');
        panel.replaceChildren();
        if (contacts.length === 1) {
          fillWorkerContact(form,contacts[0]);
          return;
        }
        contactsByForm.set(form,contacts);
        const select = document.createElement('select');
        select.dataset.workerContactChoice = '';
        select.add(new Option('Tria una persona',''));
        contacts.forEach((contact,index) => select.add(new Option(
          [contact.name,contact.email[0]].filter(Boolean).join(' · ') || contact.tel[0],String(index))));
        const label = document.createElement('label');
        label.append('Contacte de l’agenda',select);
        panel.append(label);
        select.focus();
        updateContactStatus(form,'Tria la persona que vols associar.');
      } catch {
        if (form.isConnected) updateContactStatus(form,'Tria un fitxer .vcf vàlid de fins a 8 MB.');
      } finally {
        input.value = '';
      }
    }
  });
}

const money = new Intl.NumberFormat('ca-ES', {style:'currency', currency:'EUR'});
const points = new Intl.NumberFormat('ca-ES', {maximumFractionDigits:6});
const dayLabel = new Intl.DateTimeFormat('ca-ES', {weekday:'long', day:'numeric', month:'long', timeZone:'UTC'});
const fullDate = new Intl.DateTimeFormat('ca-ES', {dateStyle:'long', timeZone:'UTC'});
const formatMoney = cents => money.format(cents / 100);
const formatPoints = units => points.format(units / 4);
const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const get = id => document.getElementById(id);

async function localRequest(body) {
  const response = await fetch('/NexaTips/api', body ? {
    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
  } : {cache:'no-store'});
  const data = await response.json();
  if (!response.ok) throw new Error(data.error);
  return data;
}

function mountTipsViewer(request, initial) {
  const content = get('content');
  const status = get('status');
  function render(current) {
    content.innerHTML = '<section class="card"><h2>Repartiment actual</h2>'+
      (current ? '<p>'+fullDate.format(dayOf(current.date))+'</p>'+
        (current.cents !== null ? '<p>Pot de propines <strong>'+formatMoney(current.cents)+'</strong></p>' : '')+
        (current.payouts.length ? '<ul class="payout-list">'+current.payouts.slice().sort((a,b) => a.name.localeCompare(b.name,'ca')).map(row =>
          '<li><span>'+escapeHtml(row.name)+'</span><span>'+formatPoints(row.units)+'</span><strong>'+formatMoney(row.cents)+'</strong></li>').join('')+'</ul>'
          : '<p class="meta">Els imports encara no estan disponibles.</p>')+
        current.days.map(day => '<div class="history-day"><strong>'+dayLabel.format(dayOf(day.date))+'</strong><p>'+
          day.entries.map(row => escapeHtml(row.name)+(row.units === null ? '' : ' · '+formatPoints(row.units))).join(', ')+'</p></div>').join('')
        : '<p class="meta">Encara no hi ha cap repartiment en curs.</p>')+
      '<button id="refresh-current" type="button">Actualitza</button></section>';
  }
  async function refresh() {
    const button = get('refresh-current');
    if (button.disabled) return;
    button.disabled = true;
    try {
      const state = await request();
      render(state.current);
      status.textContent = '';
    } catch (error) {
      render(null);
      status.textContent = error.message;
    }
  }
  content.addEventListener('click', event => {
    if (event.target.id === 'refresh-current') void refresh();
  });
  window.addEventListener('focus', () => { void refresh(); });
  render(initial.current);
}

async function mountApp(request = localRequest, initial) {
  const content = get('content');
  const status = get('status');
  const menu = get('menu-panel');
  bindWorkerContacts(content);
  const toggle = get('menu-toggle');
  let data;
  try {
    data = initial ?? await request();
  } catch {
    status.textContent = 'No s’han pogut carregar les dades. Recarrega la pàgina.';
    return;
  }
  if (data.role === 'viewer') {
    mountTipsViewer(request,data);
    return;
  }
  const today = new Intl.DateTimeFormat('en-CA', {
    timeZone:'Europe/Madrid', year:'numeric', month:'2-digit', day:'2-digit'
  }).format(new Date());
  const upcoming = shiftDay(today, (7 - weekday(today)) % 7);
  let tab = 'period';
  let historyYear;
  const workerChannel = typeof BroadcastChannel === 'function' ? new BroadcastChannel('nexa-worker-profiles') : null;
  let date;
  let days;
  let amount = '';
  let busy = false;
  let selectedDays;
  let revision = data.draft?.revision ?? 0;
  let pendingDraft;
  let savingDraft;
  const sync = get('sync-state');
  const latest = () => data.periods[0];
  const nameOf = id => data.workers.find(worker => worker.id === id)?.name ?? '';
  const collator = new Intl.Collator('ca', {sensitivity:'base'});
  const sortedWorkers = () => data.workers.slice().sort((a, b) => collator.compare(a.name, b.name));
  const activeWorkers = () => sortedWorkers().filter(worker => worker.active);
  const firstSunday = () => latest() ? shiftDay(latest().date, 7) : '';
  function resetPeriod() {
    date = upcoming >= firstSunday() ? upcoming : firstSunday();
    const next = latest() && (+dayOf(date) - +dayOf(latest().date)) / dayMs > 366 ? firstSunday() : date;
    date = next;
    days = periodDays(date, latest(), data.workers);
    selectedDays = new Set();
    amount = '';
  }
  resetPeriod();
  if (data.draft) {
    ({date, days, amount} = data.draft);
    const active = new Set(activeWorkers().map(worker => worker.id));
    for (const day of days) day.entries = day.entries.filter(row => active.has(row.id));
    sync.textContent = ' · Esborrany recuperat';
  }

  function saveDraft() {
    if (savingDraft || !pendingDraft) return savingDraft;
    sync.textContent = ' · Desant l’esborrany…';
    savingDraft = (async () => {
      let snapshot;
      try {
        while (pendingDraft) {
          snapshot = pendingDraft;
          pendingDraft = undefined;
          const result = await request({...snapshot, action:'draft', revision});
          revision = result.revision;
        }
        sync.textContent = ' · Esborrany desat';
        return true;
      } catch (error) {
        pendingDraft ??= snapshot;
        sync.textContent = ' · '+(error.message || 'No s’ha pogut desar l’esborrany.');
        return false;
      } finally {
        savingDraft = undefined;
      }
    })();
    return savingDraft;
  }

  function queueDraft() {
    pendingDraft = structuredClone({date, days, amount, previousDate:latest()?.date ?? null});
    void saveDraft();
  }

  window.addEventListener('online', () => { void saveDraft(); });
  window.addEventListener('beforeunload', event => {
    if (!savingDraft && !pendingDraft) return;
    event.preventDefault();
    event.returnValue = '';
  });

  function summary(rows) {
    if (!rows.length) return '<p class="meta">Encara no hi ha punts assignats.</p>';
    return '<ul class="payout-list">'+rows.slice().sort((a,b) => (a.name ?? nameOf(a.id)).localeCompare(b.name ?? nameOf(b.id), 'ca')).map(row =>
      '<li><span>'+escapeHtml(row.name ?? nameOf(row.id))+'</span><span>'+formatPoints(row.units)+'</span><strong>'+formatMoney(row.cents)+'</strong></li>'
    ).join('')+'</ul>';
  }

  function updateResult() {
    const cents = parseCents(amount);
    const invalidPoints = days.some(day => day.open && day.entries.some(row => !validUnits(row.units)));
    const {units, payouts} = distribute(cents ?? 0, days);
    get('total-points').textContent = formatPoints(units);
    get('per-point').textContent = units && cents !== null ? formatMoney(cents * 4 / units) : '—';
    get('result').innerHTML = invalidPoints
      ? '<p class="error">Introdueix punts positius o zero, amb fins a sis decimals.</p>'
      : cents === null ? '<p class="meta">Introdueix el pot per veure els imports.</p>' : summary(payouts);
    get('close-period').disabled = busy || invalidPoints || cents === null || (!units && cents > 0) || !days.some(day => day.open);
  }

  function renderDay(day, index) {
    const label = dayLabel.format(dayOf(day.date));
    const available = activeWorkers().filter(worker => !day.entries.some(row => row.id === worker.id));
    return '<details class="tip-day" data-day="'+index+'" '+(selectedDays.has(day.date) ? 'open' : '')+'>'+
      '<summary><strong>'+label+'</strong><span class="meta">'+(day.open ? day.entries.length+' persones' : 'Tancat')+'</span></summary>'+
      '<label class="opening"><input type="checkbox" data-open="'+index+'" '+(day.open ? 'checked' : '')+'> Restaurant obert</label>'+
      (day.open ? day.entries.slice().sort((a, b) => collator.compare(nameOf(a.id), nameOf(b.id))).map(row =>
        '<div class="assignment"><span>'+escapeHtml(nameOf(row.id))+'</span>'+
        '<div class="points-control"><input type="text" inputmode="decimal" maxlength="32" aria-label="Punts de '+escapeHtml(nameOf(row.id))+'" data-points="'+row.id+'" data-index="'+index+
        '" value="'+escapeHtml(row.text ?? (row.units === null ? '' : String(row.units / 4)).replace('.', ','))+'"><span class="point-arrows">'+
        '<button type="button" data-point-step="1" aria-label="Puja 0,25 punts a '+escapeHtml(nameOf(row.id))+'">▴</button>'+
        '<button type="button" data-point-step="-1" aria-label="Baixa 0,25 punts a '+escapeHtml(nameOf(row.id))+'">▾</button>'+
        '</span></div><button type="button" data-remove="'+row.id+'" data-index="'+index+'" aria-label="Treu '+escapeHtml(nameOf(row.id))+'">Treu</button></div>'
      ).join('')+(available.length ? '<label class="add-worker">Afegeix un treballador<select data-add="'+index+'"><option value="">Tria una persona</option>'+
        available.map(worker => '<option value="'+worker.id+'">'+escapeHtml(worker.name)+'</option>').join('')+'</select></label>' : '') : '')+
      '</details>';
  }

  function renderHistory() {
    const years = [...new Set([today.slice(0,4),...data.periods.map(period => period.date.slice(0,4))])].sort().reverse();
    if (!years.includes(historyYear)) historyYear = years[0];
    const periods = data.periods.filter(period => period.date.startsWith(historyYear+'-'));
    const names = new Map(periods.flatMap(period => period.payouts.map(row => [row.id,row.name])));
    const amounts = new Map(data.annualTotals.filter(row => row.year === historyYear).map(row => [row.worker_id,row.cents]));
    const workers = new Map(data.workers.map(row => [row.id,row.name]));
    for (const id of amounts.keys()) {
      if (!workers.has(id)) workers.set(id,names.get(id) || 'Treballador');
    }
    const totals = [...workers].map(([id,name]) => ({name,cents:amounts.get(id) ?? 0}))
      .sort((a,b) => collator.compare(a.name,b.name));
    return '<section class="card"><h2>Històric</h2><nav aria-label="Anys del repartiment">'+
      years.map(year => '<button type="button" data-history-year="'+year+'" aria-pressed="'+(year===historyYear)+'">'+year+'</button>').join('')+'</nav>'+
      '<h3>Total anual per treballador</h3>'+
      (totals.length ? '<ul class="annual-totals">'+totals.map(row => '<li><span>'+escapeHtml(row.name)+'</span><strong>'+formatMoney(row.cents)+'</strong></li>').join('')+'</ul>'
        : '<p class="meta">Encara no hi ha propines tancades per a aquest any.</p>')+
      '<h3>Repartiments</h3>'+
      periods.map(period =>
        '<details class="tip-day"><summary><strong>'+fullDate.format(dayOf(period.date))+'</strong><span>'+formatMoney(period.cents)+'</span></summary>'+
        summary(period.payouts)+period.days.filter(day => day.open).map(day => '<div class="history-day"><strong>'+
          dayLabel.format(dayOf(day.date))+'</strong><p>'+day.entries.map(row => escapeHtml(row.name)+' · '+formatPoints(row.units)).join(', ')+'</p></div>').join('')+
        '</details>').join('')+'</section>';
  }

  function render() {
    get('tabs').innerHTML = [['period','Repartiment'],['workers','Equip'],['history','Històric']].map(([key, label]) =>
      '<button type="button" data-tab="'+key+'" '+(tab === key ? 'aria-current="page"' : '')+'>'+label+'</button>').join('');
    if (tab === 'period') {
      content.innerHTML = '<section class="card"><h2>Repartiment</h2><div class="grid">'+
        '<label>Diumenge del repartiment<input id="period-date" type="date" value="'+date+'" min="'+firstSunday()+'"></label>'+
        '<label>Pot de propines (€)<input id="amount" type="text" inputmode="decimal" maxlength="32" placeholder="0,00" value="'+escapeHtml(amount)+'"></label></div></section>'+
        '<section class="card"><h2>Dies i treballadors</h2>'+
        (!activeWorkers().length ? '<p class="meta">Afegeix persones al menú Equip per començar.</p>' : '')+
        days.map(renderDay).join('')+'</section><section class="card"><h2>Resultat</h2>'+
        '<div class="result-meta"><div><span>Parts totals</span><strong id="total-points"></strong></div>'+
        '<div><span>Valor per punt</span><strong id="per-point"></strong></div></div>'+
        '<div id="result"></div><button id="close-period" class="primary" type="button">Tanca el repartiment</button></section>';
      updateResult();
    } else if (tab === 'workers') {
      content.innerHTML = renderWorkerProfiles(data.workers,escapeHtml);
    } else {
      content.innerHTML = renderHistory();
    }
  }

  async function save(body, callback, message) {
    if (busy) return;
    busy = true;
    content.inert = true;
    status.classList.remove('error');
    status.textContent = 'Desant…';
    try {
      if (body.action === 'close') {
        const saved = await saveDraft();
        if (saved === false) throw new Error('L’esborrany no està desat. Revisa l’avís al costat de la versió.');
        body.revision = revision;
      }
      await request(body);
      if (body.action === 'close') {
        revision = 0;
        sync.textContent = '';
      }
      data = await request();
      callback?.();
      status.textContent = message;
    } catch (error) {
      status.classList.add('error');
      status.textContent = error.message;
    } finally {
      busy = false;
      content.inert = false;
      render();
    }
  }

  async function refreshWorkerProfiles() {
    if (busy) return;
    try {
      const refreshed = await request();
      data.workers = refreshed.workers;
      const active = new Set(activeWorkers().map(worker => worker.id));
      for (const day of days) day.entries = day.entries.filter(row => active.has(row.id));
      if (tab !== 'history') render();
    } catch (error) {
      status.textContent = error.message;
    }
  }
  if (workerChannel) workerChannel.onmessage = () => { void refreshWorkerProfiles(); };

  toggle.hidden = false;
  toggle.addEventListener('click', () => {
    menu.hidden = !menu.hidden;
    toggle.setAttribute('aria-expanded', String(!menu.hidden));
  });
  get('tabs').addEventListener('click', event => {
    const button = event.target.closest('[data-tab]');
    if (!button || busy) return;
    tab = button.dataset.tab;
    menu.hidden = true;
    toggle.setAttribute('aria-expanded','false');
    render();
    if (tab === 'workers') void refreshWorkerProfiles();
  });
  const theme = get('theme');
  function setTheme(dark) {
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    theme.textContent = dark ? 'Mode clar' : 'Mode fosc';
    theme.setAttribute('aria-pressed', String(dark));
  }
  setTheme(localStorage.getItem('nexatips-theme') === 'dark');
  theme.addEventListener('click', () => {
    const dark = document.documentElement.dataset.theme !== 'dark';
    localStorage.setItem('nexatips-theme', dark ? 'dark' : 'light');
    setTheme(dark);
  });

  content.addEventListener('toggle', event => {
    const index = event.target.dataset.day;
    if (index === undefined || !days[index]) return;
    if (event.target.open) selectedDays.add(days[index].date);
    else selectedDays.delete(days[index].date);
  }, true);
  content.addEventListener('input', event => {
    const field = event.target;
    if (field.dataset.points) {
      const row = days[field.dataset.index].entries.find(entry => entry.id === field.dataset.points);
      const value = field.value.trim();
      row.text = field.value;
      row.units = /^\d{1,6}(?:[.,]\d{1,6})?$/.test(value) ? Math.round(Number(value.replace(',', '.')) * 1000000) / pointScale : null;
      updateResult();
      queueDraft();
    } else if (field.id === 'amount') {
      amount = event.target.value;
      updateResult();
      queueDraft();
    }
  });
  content.addEventListener('change', event => {
    const field = event.target;
    const {open, add} = field.dataset;
    if (field.id === 'period-date') {
      const chosen = field.value;
      if (!validDay(chosen) || weekday(chosen) !== 0 || chosen < firstSunday() ||
          (latest() && (+dayOf(chosen) - +dayOf(latest().date)) / dayMs > 366)) {
        field.value = date;
        status.classList.add('error');
        status.textContent = 'Tria un diumenge vàlid posterior a l’últim repartiment.';
        return;
      }
      const existing = new Map(days.map(day => [day.date, day]));
      date = chosen;
      days = periodDays(date, latest(), data.workers).map(day => existing.get(day.date) ?? day);
      status.textContent = '';
    } else if (open !== undefined) {
      days[open].open = field.checked;
    } else if (add !== undefined && field.value) {
      const day = days[add];
      const {matching, previous} = suggestedPoints(field.value, day.date, days, data.periods);
      day.entries.push({id:field.value, units:matching ?? previous ?? null});
    } else {
      return;
    }
    queueDraft();
    render();
  });
  function stepPoints(field, step) {
    const row = days[field.dataset.index].entries.find(entry => entry.id === field.dataset.points);
    const scaled = Math.round((row.units ?? 0) * pointScale);
    const next = Math.min(Math.round(maxUnits * pointScale), Math.max(0, scaled + step * pointScale));
    field.value = String(next / (4 * pointScale)).replace('.', ',');
    field.dispatchEvent(new Event('input', {bubbles:true}));
  }

  content.addEventListener('keydown', event => {
    if (!event.target.dataset.points || !['ArrowUp', 'ArrowDown'].includes(event.key)) return;
    event.preventDefault();
    stepPoints(event.target, event.key === 'ArrowUp' ? 1 : -1);
  });
  content.addEventListener('click', event => {
    const button = event.target.closest('button');
    if (!button || busy) return;
    const {remove, index, historyYear:year, pointStep} = button.dataset;
    if (year) {
      historyYear = year;
      render();
      content.querySelector('[data-history-year="'+year+'"]').focus();
    } else if (pointStep) {
      stepPoints(button.closest('.points-control').querySelector('input'), Number(pointStep));
    } else if (remove) {
      days[index].entries = days[index].entries.filter(row => row.id !== remove);
      queueDraft();
      render();
    } else if (button.id === 'close-period') {
      const cents = parseCents(amount);
      if (!confirm('Tancar el repartiment de '+formatMoney(cents)+'?')) return;
      void save({action:'close', date, cents, days:days.map(day => day.open ? day : {...day, entries:[]}), previousDate:latest()?.date ?? null}, () => {
        resetPeriod();
        tab = 'history';
      }, 'S’ha tancat el repartiment.');
    }
  });
  content.addEventListener('submit', event => {
    if (!event.target.matches('[data-worker-profile]')) return;
    event.preventDefault();
    const profile = workerProfilePayload(event.target);
    void save(profile, () => {
      if (!profile.active && days.some(day => day.entries.some(row => row.id === profile.id))) {
        for (const day of days) day.entries = day.entries.filter(row => row.id !== profile.id);
        queueDraft();
      }
      workerChannel?.postMessage('updated');
    }, 'S’ha desat la fitxa.');
  });
  render();
}

import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js';
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  sendEmailVerification, sendPasswordResetEmail, signOut, reload, checkActionCode, applyActionCode, verifyPasswordResetCode, confirmPasswordReset
} from 'https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js';

async function startStaffApp(apiOrigin, mountApp, apiPath = "/api") {
  const panel = document.querySelector('#login-panel');
  const form = document.querySelector('#login-form');
  const message = document.querySelector('#login-status');
  const actions = document.querySelector('#verify-actions');
  const repair = document.querySelector('#verify-link-form');
  const resetPanel = document.querySelector('#reset-panel');
  const resetForm = document.querySelector('#reset-link-form');
  const logout = document.querySelector('#logout');
  const workspace = document.querySelector('#workspace');
  let auth;
  let mounted = false;
  let busy = false;
  const emailAction = new URL(location.href);
  const incomingMode = emailAction.searchParams.get('mode');
  let actionMode = ['verifyEmail','resetPassword'].includes(incomingMode) && emailAction.searchParams.get('oobCode') ? incomingMode : '';
  if (actionMode) history.replaceState(null,'',location.pathname);

  function show(text) {
    message.textContent = text;
  }

  function errorMessage(error) {
    switch (error.code) {
      case 'auth/invalid-credential': return 'El correu o la contrasenya no són correctes.';
      case 'auth/email-already-in-use': return 'Aquest correu ja té compte. Inicia sessió o restableix la contrasenya.';
      case 'auth/weak-password': return 'Tria una contrasenya d’almenys sis caràcters.';
      case 'auth/too-many-requests': return 'Massa intents. Torna-ho a provar més tard.';
      default: return error.status ? error.message : 'No hi ha connexió amb el servei d’accés. Torna-ho a provar.';
    }
  }

  async function request(body) {
    const token = await auth.currentUser?.getIdToken();
    if (!token) throw Object.assign(new Error('Torna a iniciar sessió.'),{status:401});
    const headers = {Authorization:'Bearer '+token};
    if (body) headers['Content-Type'] = 'application/json';
    const response = await fetch(apiOrigin+apiPath,{method:body ? 'POST' : 'GET',headers,
      body:body ? JSON.stringify(body) : undefined,cache:'no-store',credentials:'omit'});
    const result = await response.json();
    if (!response.ok) throw Object.assign(new Error(result.error),{status:response.status});
    return result;
  }

  async function enter(user) {
    form.hidden = Boolean(user);
    resetPanel.hidden = Boolean(user);
    actions.hidden = !user;
    repair.hidden = !user || user.emailVerified;
    logout.hidden = !user;
    if (!user) {
      show('');
      return;
    }
    show('Comprovant l’accés…');
    try {
      const data = await request();
      if (auth.currentUser?.uid !== user.uid || mounted) return;
      mounted = true;
      panel.hidden = true;
      workspace.hidden = false;
      mountApp(request,data);
    } catch (error) {
      document.querySelector('#resend-verification').hidden = user.emailVerified;
      show(errorMessage(error));
    }
  }

  async function withFeedback(operation) {
    if (busy) return;
    busy = true;
    try { await operation(); }
    catch (error) { show(errorMessage(error)); }
    finally { busy = false; }
  }

  try {
    const response = await fetch(apiOrigin+'/auth-config',{cache:'no-store',credentials:'omit'});
    if (!response.ok) throw new Error('Firebase configuration unavailable');
    // Keep the existing Firebase app key so sessions survive the rename.
    auth = getAuth(initializeApp(await response.json(),'tracacomandes'));
    auth.languageCode = 'ca';
  } catch {
    show('L’accés de l’equip no està disponible. Torna-ho a provar més tard.');
    form.hidden = true;
    resetPanel.hidden = true;
    return;
  }

  const emailField = form.elements.email;
  form.addEventListener('submit',event => {
    event.preventDefault();
    void withFeedback(async () => {
      const email = emailField.value.trim();
      const password = form.elements.password.value;
      if (event.submitter?.value === 'register') {
        const {user} = await createUserWithEmailAndPassword(auth,email,password);
        await sendEmailVerification(user);
        show('T’hem enviat un correu de verificació. Obre’l i torna aquí per continuar.');
      } else {
        await signInWithEmailAndPassword(auth,email,password);
      }
      form.reset();
    });
  });

  function emailActionCode(value, mode) {
    try {
      const link = new URL(value.trim());
      if (((link.origin === 'https://'+auth.app.options.authDomain && link.pathname === '/__/auth/action') ||
           (link.origin === 'https://jninforner.github.io' && ['/NexaTips/','/NexaComandes/','/tracacomandes/'].includes(link.pathname))) && link.searchParams.get('mode') === mode) {
        return link.searchParams.get('oobCode');
      }
    } catch {
      return null;
    }
    return null;
  }

  resetForm.addEventListener('submit',event => {
    event.preventDefault();
    void withFeedback(async () => {
      const code = emailActionCode(resetForm.elements.link.value,'resetPassword');
      if (!code) {
        show('Enganxa l’enllaç complet del correu de restabliment de contrasenya de NexaTips.');
        return;
      }
      try {
        const email = await verifyPasswordResetCode(auth,code);
        await confirmPasswordReset(auth,code,resetForm.elements.password.value);
        resetForm.reset();
        resetForm.elements.link.closest('label').hidden = false;
        resetPanel.open = false;
        if (actionMode) {
          actionMode = '';
          if (auth.currentUser) await signOut(auth);
          await enter(null);
        }
        emailField.value = email;
        form.elements.password.value = '';
        form.elements.password.focus();
        show('Contrasenya desada. Ja pots entrar amb la nova.');
      } catch (error) {
        resetForm.elements.password.value = '';
        if (['auth/invalid-action-code','auth/expired-action-code'].includes(error.code)) {
          show('Aquest enllaç ha caducat o ja s’ha utilitzat. Demana’n un de nou amb «He oblidat la contrasenya».');
        } else {
          throw error;
        }
      }
    });
  });

  document.querySelector('#password-reset').onclick = event => {
    event.preventDefault();
    void withFeedback(async () => {
      if (!emailField.reportValidity()) return;
      await sendPasswordResetEmail(auth,emailField.value.trim());
      show('Si existeix un compte amb aquest correu, rebràs un enllaç per restablir la contrasenya.');
    });
  };

  document.querySelector('#retry-login').onclick = () => withFeedback(async () => {
    if (!auth.currentUser) return;
    await reload(auth.currentUser);
    if (!auth.currentUser) return;
    await auth.currentUser.getIdToken(true);
    await enter(auth.currentUser);
  });

  document.querySelector('#resend-verification').onclick = () => withFeedback(async () => {
    if (!auth.currentUser) return;
    await sendEmailVerification(auth.currentUser);
    show('T’hem tornat a enviar el correu de verificació.');
  });

  repair.addEventListener('submit',event => {
    event.preventDefault();
    void withFeedback(async () => {
      const user = auth.currentUser;
      if (!user && actionMode !== 'verifyEmail') return;
      const code = emailActionCode(repair.elements.link.value,'verifyEmail');
      if (!code) {
        show('Enganxa l’enllaç complet del correu de verificació de NexaComandes.');
        return;
      }
      try {
        const info = await checkActionCode(auth,code);
        if (info.operation !== 'VERIFY_EMAIL' || (user && actionMode !== 'verifyEmail' && info.data.email?.toLowerCase() !== user.email?.toLowerCase())) {
          show('Aquest enllaç correspon a un altre compte.');
          return;
        }
        await applyActionCode(auth,code);
        repair.reset();
        actionMode = '';
        if (user && info.data.email?.toLowerCase() === user.email?.toLowerCase()) {
          await reload(user);
          await user.getIdToken(true);
          await enter(user);
        } else {
          if (user) await signOut(auth);
          await enter(null);
          emailField.value = info.data.email || '';
          show('Correu verificat. Ja pots iniciar sessió.');
        }
      } catch (error) {
        if (['auth/invalid-action-code','auth/expired-action-code'].includes(error.code)) {
          show('L’enllaç ha caducat o ja s’ha utilitzat. Prem «Comprova l’accés» o demana un correu nou.');
        } else {
          throw error;
        }
      }
    });
  });

  logout.onclick = () => withFeedback(async () => {
    await signOut(auth);
    location.reload();
  });

  if (actionMode) {
    form.hidden = true;
    resetPanel.hidden = actionMode !== 'resetPassword';
    resetPanel.open = !resetPanel.hidden;
    repair.hidden = actionMode !== 'verifyEmail';
    const current = resetPanel.hidden ? repair : resetForm;
    current.elements.link.value = emailAction.href;
    current.elements.link.closest('label').hidden = true;
    show(actionMode === 'resetPassword' ? 'Tria una contrasenya nova.' : 'Prem el botó per confirmar el correu.');
  }

  onAuthStateChanged(auth,user => {
    if (actionMode) return;
    if (mounted && !user) location.reload();
    else if (!mounted) void enter(user);
  });
}

startStaffApp(location.hostname === "jninforner.github.io" ? "https://comandes-cuina-mworkeza.shinyshrew16.chatgpt.site" : location.origin, mountApp, "/NexaTips/api");
</script>
</body>
</html>
